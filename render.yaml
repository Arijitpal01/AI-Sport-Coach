services:
  - type: web
    name: ai-sports-coach
    runtime: python
    buildCommand: apt-get update && apt-get install -y libgl1 libgles2 && pip install -r requirements.txt
    startCommand: gunicorn backend.main:app --bind 0.0.0.0:$PORT --worker-class uvicorn.workers.UvicornWorker
    healthCheckPath: /health
